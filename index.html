<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>החופשה שלי | TLV ⇄ אירופה</title>
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0b0e13">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0b0e13;
    --panel: #141a22;
    --panel-border: #232b36;
    --text: #edeff2;
    --muted: #7c8797;
    --amber: #ffb020;
    --teal: #37b6a7;
    --danger: #e85c4a;
  }
  html[data-theme="light"] {
    --bg: #f5f6f8;
    --panel: #ffffff;
    --panel-border: #dde1e7;
    --text: #14181f;
    --muted: #5c6572;
    --amber: #b8730a;
    --teal: #0e8e7d;
    --danger: #c93f2e;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    padding: 24px 16px 64px;
    transition: background 0.2s ease, color 0.2s ease;
  }
  .mono { font-family: 'IBM Plex Mono', monospace; }
  .wrap { max-width: 920px; margin: 0 auto; }

  header {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    flex-wrap: wrap;
    gap: 12px;
    border-bottom: 1px solid var(--panel-border);
    padding-bottom: 20px;
    margin-bottom: 28px;
  }
  h1 {
    font-family: 'IBM Plex Mono', monospace;
    font-size: clamp(28px, 6vw, 44px);
    font-weight: 700;
    letter-spacing: 0.5px;
    margin: 0;
    direction: ltr;
    text-align: right;
  }
  h1 span.arrow { color: var(--amber); }
  .brand {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .brand img {
    width: 44px;
    height: 44px;
    border-radius: 10px;
    flex-shrink: 0;
  }
  .subtitle {
    color: var(--muted);
    font-size: 13px;
    margin-top: 6px;
    font-family: 'IBM Plex Mono', monospace;
    letter-spacing: 0.5px;
  }
  .updated {
    color: var(--muted);
    font-size: 12px;
    text-align: left;
    direction: ltr;
    font-family: 'IBM Plex Mono', monospace;
  }
  .updated b { color: var(--teal); }

  .toolbar {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 10px;
    margin-bottom: 16px;
    flex-wrap: wrap;
  }
  .icon-btn {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    color: var(--text);
    width: 34px;
    height: 34px;
    border-radius: 8px;
    font-size: 16px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .icon-btn:active { transform: scale(0.94); }
  .version-badge {
    background: none;
    border: none;
    color: var(--muted);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    cursor: pointer;
    padding: 4px 6px;
    direction: ltr;
  }
  .version-badge:hover { color: var(--teal); }

  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.6);
    z-index: 50;
    align-items: flex-end;
    justify-content: center;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 16px 16px 0 0;
    width: 100%;
    max-width: 560px;
    max-height: 75vh;
    overflow-y: auto;
    padding: 20px;
  }
  .modal h2 {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 16px;
    margin: 0 0 14px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .modal .close-x {
    background: none; border: none; color: var(--muted); font-size: 20px; cursor: pointer;
  }
  .version-entry { margin-bottom: 14px; padding-bottom: 14px; border-bottom: 1px solid var(--panel-border); }
  .version-entry:last-child { border-bottom: none; }
  .version-entry .ver {
    font-family: 'IBM Plex Mono', monospace;
    font-weight: 700;
    color: var(--teal);
    direction: ltr;
    display: inline-block;
  }
  .version-entry .vdate { color: var(--muted); font-size: 12px; margin-right: 8px; }
  .version-entry ul { margin: 6px 0 0; padding-right: 18px; font-size: 13px; color: var(--text); }

  .watchlist-box {
    border: 1px solid var(--teal);
    border-radius: 10px;
    background: var(--panel);
    padding: 14px 16px;
    margin-bottom: 20px;
  }
  .watchlist-box h3 {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px;
    margin: 0 0 10px;
    color: var(--teal);
  }
  .watch-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 0;
    border-bottom: 1px solid var(--panel-border);
    font-size: 13px;
  }
  .watch-row:last-child { border-bottom: none; }
  .watch-row .wname { font-weight: 600; }
  .watch-row .wdates { color: var(--muted); font-family: 'IBM Plex Mono', monospace; font-size: 11px; direction: ltr; }
  .watch-row .wprice { font-family: 'IBM Plex Mono', monospace; font-weight: 700; direction: ltr; }
  .watchlist-box .edit-link {
    display: inline-block;
    margin-top: 10px;
    font-size: 12px;
    color: var(--teal);
  }

  .settings-bar {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 16px;
  }
  .chip {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 6px;
    padding: 6px 12px;
    font-size: 12px;
    color: var(--muted);
    font-family: 'IBM Plex Mono', monospace;
  }
  .chip b { color: var(--text); }

  .filter-bar {
    margin-bottom: 24px;
  }
  .filter-bar select {
    width: 100%;
    background: var(--panel);
    border: 1px solid var(--panel-border);
    color: var(--text);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 14px;
    padding: 12px 14px;
    border-radius: 8px;
    appearance: none;
    -webkit-appearance: none;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%237c8797' stroke-width='2'><path d='M6 9l6 6 6-6'/></svg>");
    background-repeat: no-repeat;
    background-position: left 14px center;
    background-size: 18px;
  }
  .filter-bar select:focus { outline: 2px solid var(--teal); }

  .board {
    border: 1px solid var(--panel-border);
    border-radius: 10px;
    overflow: hidden;
    background: var(--panel);
  }
  .board-header {
    display: grid;
    grid-template-columns: 70px 1fr 120px 85px 85px 80px;
    gap: 8px;
    padding: 10px 16px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--muted);
    border-bottom: 1px solid var(--panel-border);
  }
  .row {
    display: grid;
    grid-template-columns: 70px 1fr 120px 85px 85px 80px;
    gap: 8px;
    align-items: center;
    padding: 14px 16px;
    border-bottom: 1px solid var(--panel-border);
    transition: background 0.2s ease;
  }
  .row:last-child { border-bottom: none; }
  .row:hover { background: rgba(255,255,255,0.02); }
  .row.deal { background: rgba(255, 176, 32, 0.08); }
  .row.deal:hover { background: rgba(255, 176, 32, 0.13); }

  .code {
    font-family: 'IBM Plex Mono', monospace;
    font-weight: 700;
    font-size: 18px;
    letter-spacing: 1px;
  }
  .dest .name { font-weight: 600; }
  .dest .country { color: var(--muted); font-size: 12px; }
  .dates {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    color: var(--muted);
    direction: ltr;
    text-align: left;
  }
  .price {
    font-family: 'IBM Plex Mono', monospace;
    font-weight: 700;
    font-size: 15px;
    direction: ltr;
    text-align: left;
  }
  .price.empty-val { color: var(--panel-border); font-weight: 400; }
  .col-label {
    display: none;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 2px;
  }
  .discount {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px;
    font-weight: 600;
    text-align: left;
    direction: ltr;
  }
  .discount.good { color: var(--amber); }
  .discount.bad { color: var(--muted); }
  .discount.none { color: var(--panel-border); }

  .sparkline { margin-top: 3px; }

  footer {
    margin-top: 28px;
    color: var(--panel-border);
    font-size: 11px;
    text-align: center;
    font-family: 'IBM Plex Mono', monospace;
  }

  .empty {
    padding: 60px 20px;
    text-align: center;
    color: var(--muted);
    font-family: 'IBM Plex Mono', monospace;
  }

  @media (max-width: 640px) {
    .board-header { display: none; }
    .row {
      grid-template-columns: 1fr 1fr;
      gap: 10px 4px;
      padding: 14px;
    }
    .row .code, .row .dest { grid-column: 1 / -1; }
    .dates, .discount { text-align: right; direction: rtl; }
    .discount { direction: ltr; text-align: left; }
    .col-label { display: block; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <img src="icon-192.png" alt="החופשה שלי">
      <div>
        <h1>TLV <span class="arrow">⇄</span> EUROPE</h1>
        <div class="subtitle">החופשה שלי — לוח מחירי טיסות ומלונות</div>
      </div>
    </div>
    <div class="updated" id="updated">טוען...</div>
  </header>

  <div class="toolbar">
    <button class="version-badge" onclick="openVersionModal()" id="versionBadge">v...</button>
    <button class="icon-btn" onclick="refreshApp()" title="רענן לגרסה אחרונה">⟳</button>
    <button class="icon-btn" onclick="toggleTheme()" title="החלף מצב כהה/בהיר" id="themeToggleBtn">🌙</button>
  </div>

  <div class="settings-bar" id="settingsBar"></div>

  <div class="watchlist-box" id="watchlistBox" style="display:none;">
    <h3>👀 רשימת מעקב אישית</h3>
    <div id="watchlistRows"></div>
    <a class="edit-link" href="https://github.com/tomtom0506/tomtom_Travel/edit/main/config/settings.json" target="_blank">+ הוספת חיפוש למעקב</a>
  </div>

  <div class="filter-bar">
    <select id="destFilter" onchange="applyFilter()">
      <option value="">כל היעדים</option>
    </select>
  </div>

  <div class="board" id="board">
    <div class="board-header">
      <div>קוד</div>
      <div>עיר</div>
      <div>תאריכים</div>
      <div>טיסה</div>
      <div>מלון</div>
      <div>מהחציון</div>
    </div>
    <div id="rows"><div class="empty">טוען נתונים...</div></div>
  </div>

  <footer>מתעדכן אוטומטית כל 6 שעות באמצעות GitHub Actions</footer>
</div>

<div class="modal-overlay" id="versionModal" onclick="if(event.target===this) closeVersionModal()">
  <div class="modal">
    <h2>היסטוריית גרסאות <button class="close-x" onclick="closeVersionModal()">✕</button></h2>
    <div id="versionList">טוען...</div>
  </div>
</div>

<script>
const APP_VERSION = "1.6.0";
let allResults = [];
let allHistory = {};
let allSettings = {};

// ---- theme ----
function applyTheme(theme) {
  document.documentElement.setAttribute('data-theme', theme);
  document.getElementById('themeToggleBtn').textContent = theme === 'light' ? '☀️' : '🌙';
}
function toggleTheme() {
  const current = document.documentElement.getAttribute('data-theme') === 'light' ? 'light' : 'dark';
  const next = current === 'light' ? 'dark' : 'light';
  localStorage.setItem('theme', next);
  applyTheme(next);
}
(function initTheme() {
  const saved = localStorage.getItem('theme') || 'dark';
  applyTheme(saved);
})();

// ---- refresh to latest ----
function refreshApp() {
  const url = new URL(location.href);
  url.searchParams.set('_r', Date.now());
  location.href = url.toString();
}

// ---- version history modal ----
async function openVersionModal() {
  document.getElementById('versionModal').classList.add('open');
  const listEl = document.getElementById('versionList');
  try {
    const res = await fetch('changelog.json?_=' + Date.now());
    const changelog = await res.json();
    listEl.innerHTML = changelog.map((v) => (
      '<div class="version-entry">' +
        '<span class="ver">v' + v.version + '</span><span class="vdate">' + v.date + '</span>' +
        '<ul>' + v.notes.map((n) => '<li>' + n + '</li>').join('') + '</ul>' +
      '</div>'
    )).join('');
  } catch (e) {
    listEl.innerHTML = '<div class="empty">לא ניתן לטעון את היסטוריית הגרסאות</div>';
  }
}
function closeVersionModal() {
  document.getElementById('versionModal').classList.remove('open');
}

async function loadData() {
  document.getElementById('versionBadge').textContent = 'v' + APP_VERSION;
  const [latestRes, historyRes] = await Promise.all([
    fetch('data/latest.json?_=' + Date.now()).catch(() => null),
    fetch('data/history.json?_=' + Date.now()).catch(() => null),
  ]);
  const latest = latestRes && latestRes.ok ? await latestRes.json() : null;
  const history = historyRes && historyRes.ok ? await historyRes.json() : {};
  render(latest, history);
}

function fmtDate(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  return d.toLocaleString('he-IL', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
}

function sparkline(points, w = 76, h = 22) {
  if (!points || points.length < 2) return '';
  const min = Math.min(...points), max = Math.max(...points);
  const range = max - min || 1;
  const step = w / (points.length - 1);
  const path = points.map((p, i) => {
    const x = i * step;
    const y = h - ((p - min) / range) * h;
    return (i === 0 ? 'M' : 'L') + x.toFixed(1) + ',' + y.toFixed(1);
  }).join(' ');
  return '<svg class="sparkline" width="' + w + '" height="' + h + '" viewBox="0 0 ' + w + ' ' + h + '">' +
    '<path d="' + path + '" fill="none" stroke="#37b6a7" stroke-width="1.5" /></svg>';
}

function populateFilter(results) {
  const select = document.getElementById('destFilter');
  select.innerHTML = '<option value="">כל היעדים (' + results.length + ')</option>' +
    results.map((r) => '<option value="' + r.code + '">' + r.name + ' (' + r.code + ')</option>').join('');
}

function applyFilter() {
  const code = document.getElementById('destFilter').value;
  const filtered = code ? allResults.filter((r) => r.code === code) : allResults;
  renderRows(filtered);
}

function renderRows(results) {
  const rowsEl = document.getElementById('rows');
  if (results.length === 0) {
    rowsEl.innerHTML = '<div class="empty">אין תוצאות ליעד הזה</div>';
    return;
  }

  rowsEl.innerHTML = results.map((r) => {
    const flightPrice = r.confirmedPrice || r.approxPrice;
    const isDeal = r.discountPercent !== null && r.discountPercent >= (allSettings.discountThresholdPercent || 999999);
    const discountClass = r.discountPercent === null ? 'none' : (isDeal ? 'good' : 'bad');
    const discountText = r.discountPercent === null ? 'אין היסטוריה' : (r.discountPercent > 0 ? '↓ ' + r.discountPercent + '%' : '↑ ' + Math.abs(r.discountPercent) + '%');
    const points = (allHistory[r.code] || []).map(p => p.price);
    const hotelCell = r.hotel
      ? '<div class="price">' + Math.round(r.hotel.price) + ' ' + r.hotel.currency + '</div>'
      : '<div class="price empty-val">—</div>';

    return '<div class="row ' + (isDeal ? 'deal' : '') + '">' +
      '<div class="code">' + r.code + '</div>' +
      '<div class="dest"><div class="name">' + r.name + '</div><div class="country">' + r.country + '</div></div>' +
      '<div class="dates">' + r.departureDate + ' → ' + r.returnDate + '</div>' +
      '<div><span class="col-label">טיסה</span><div class="price">' + Math.round(flightPrice) + ' ' + (allSettings.currency || 'ILS') + '</div>' + sparkline(points) + '</div>' +
      '<div><span class="col-label">מלון (ללילה)</span>' + hotelCell + '</div>' +
      '<div><span class="col-label">מהחציון</span><div class="discount ' + discountClass + '">' + discountText + '</div></div>' +
    '</div>';
  }).join('');
}

function render(latest, history) {
  document.getElementById('updated').innerHTML = latest && latest.lastRun
    ? 'עדכון אחרון: <b>' + fmtDate(latest.lastRun) + '</b>'
    : 'אין נתונים עדיין — ממתין לריצה ראשונה';

  const s = (latest && latest.settings) || {};
  allSettings = s;
  const bar = document.getElementById('settingsBar');
  if (s.departureDate) {
    bar.innerHTML =
      '<div class="chip">מוצא: <b>' + (s.origin || '-') + '</b></div>' +
      '<div class="chip">יציאה: <b>' + s.departureDate + '</b></div>' +
      '<div class="chip">חזרה: <b>' + s.returnDate + '</b></div>' +
      '<div class="chip">גמישות: <b>' + (s.flexible ? '±' + s.flexDays + ' ימים' : 'תאריכים קבועים') + '</b></div>' +
      '<div class="chip">סף התראה: <b>' + s.discountThresholdPercent + '%</b></div>';
  }

  allResults = (latest && latest.results) || [];
  allHistory = history || {};

  const watchlistResults = (latest && latest.watchlistResults) || [];
  const watchBox = document.getElementById('watchlistBox');
  if (watchlistResults.length > 0) {
    watchBox.style.display = 'block';
    document.getElementById('watchlistRows').innerHTML = watchlistResults.map((w) => (
      '<div class="watch-row">' +
        '<div><div class="wname">' + (w.note || w.code) + '</div><div class="wdates">' + w.departureDate + ' → ' + w.returnDate + '</div></div>' +
        '<div class="wprice">' + Math.round(w.price) + ' ' + (s.currency || 'ILS') + '</div>' +
      '</div>'
    )).join('');
  } else {
    watchBox.style.display = 'none';
  }

  if (allResults.length === 0) {
    document.getElementById('rows').innerHTML = '<div class="empty">אין נתונים עדיין — ממתין לריצה ראשונה של ה-Action</div>';
    return;
  }

  populateFilter(allResults);
  renderRows(allResults);
}

loadData();
</script>
</body>
</html>
